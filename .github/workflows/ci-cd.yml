namee: CI/CD DevOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploys:
    runs-on: self-hosted

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion Docker Hub
        run: echo "$({ secrets.DOCKER_PASSWORD }}"| docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build de l'image Docker 
        run: docker build -t ${{ secrets.DOCKER_USERNAME}}/mon-api:latest .

      - name: Push de l'image Docker 
        run: docker push ${{ secrets_DOCKER_USERNAME }}/mon-api:latest

      - name: Déploiement Kubernetes
        run: |
          kubectl apply -f k8s/mysql-deployument.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-hpa.yaml
