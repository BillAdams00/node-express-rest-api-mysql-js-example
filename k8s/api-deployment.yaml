apiVersion: apps/v1
kind: Deployment
metadata:
   name: api
spec:
  replicas: 1
  selector:
     matchLabels:
       app: api
  template:
    metadata:
      labels:
         app: api
    spec:
      containers:
        - name: api
          image: adamsbill/mon-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USERNAME
              value: root
            - name: DB_USERNAME_PASSWORD
              value: root
            - name: DB_NAME
              value: test
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000

